syntax = "proto3";

package proto;

option go_package = "github.com/vilasle/gokeep/proto";

message CreateAccountRequest {
  string login = 1;
  string password = 2;
}

message ConfirmAssess {
  string token = 1;
}

message CreateAccountResponse {
  string error = 1;
}

message LoginRequest {
  string login = 1;
  string password = 2;
  bytes public_key = 3;
}

message LoginResponse {
  string token = 1;
  string error = 2;
}

service AccountService {
  rpc CreateAccount(CreateAccountRequest) returns (CreateAccountResponse) {}
  rpc Login(LoginRequest) returns (LoginResponse) {}
}

message EncryptedData {
    string view = 1;
    bytes data = 2;
    bytes dek = 3;
    repeated Metadata metadata = 4;
}

message Metadata {
    string key = 1;
    string value = 2;
}

message EncryptedDataResponse {
    int64 id = 1;
    EncryptedData data = 2;
    string error = 4;
}

message DeleteDataRequest {
    int64 id = 1;
    int32 type = 2;
    ConfirmAssess credential = 3;
}

message DeleteDataResponse {
    string error = 1;
}

message GetDataRequest {
  int64 id = 1;
  int32 type = 2;
  ConfirmAssess credential = 3;
}


message GetDataResponse {
  repeated EncryptedData data = 1;
  string error = 2;
}

message SaveLoginPasswordRequest {
    int64 id = 1;
    string login = 2;
    string password = 3;
    ConfirmAssess credential = 4;
}

message SaveBankCardRequest {
    int64 id = 1;
    string number = 2;
    string expires = 3;
    int64 cvv = 4;
    ConfirmAssess credential = 5;
}

message SaveTextDataRequest {
    int64 id = 1;
    string name = 2;
    bytes data = 3;
    ConfirmAssess credential = 4;
}

message SaveBinaryDataRequest {
    int64 id = 1;
    string name = 2;
    bytes data = 3;
    ConfirmAssess credential = 4;
}

service PrivateDataService {
    rpc SaveLoginPassword(SaveLoginPasswordRequest) returns (EncryptedDataResponse) {}
    rpc SaveBankCard(SaveBankCardRequest) returns (EncryptedDataResponse) {}
    rpc SaveTextData(SaveTextDataRequest) returns (EncryptedDataResponse) {}
    rpc SaveBinaryData(SaveBinaryDataRequest) returns (EncryptedDataResponse) {}
    
    rpc Get(GetDataRequest) returns (GetDataResponse) {}
    
    rpc Delete(DeleteDataRequest) returns (DeleteDataResponse) {}
}






